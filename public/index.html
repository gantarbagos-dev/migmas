<style>
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #07090e;
    color: #f1f5f9;
    -webkit-tap-highlight-color: transparent;
  }
  input, button {
    outline: none;
  }
  input:focus, button:focus {
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
  }
  ::-webkit-scrollbar {
    width: 4px;
    height: 4px;
  }
  ::-webkit-scrollbar-track {
    background: #0b0f19;
  }
  ::-webkit-scrollbar-thumb {
    background: #1e293b;
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #334155;
  }
  /* Modern unified textbox system: white, compact, touch-friendly. */
  input:not([type="file"]):not(.hidden),
  textarea,
  select {
    background: #ffffff !important;
    color: #0f172a !important;
    border-color: #cbd5e1 !important;
    caret-color: #2563eb;
  }
  input:not([type="file"]):not(.hidden)::placeholder,
  textarea::placeholder {
    color: #64748b !important;
    opacity: 1;
  }
  input:not([type="file"]):not(.hidden):focus,
  textarea:focus,
  select:focus {
    background: #ffffff !important;
    color: #0f172a !important;
    border-color: #3b82f6 !important;
    box-shadow: 0 0 0 3px rgba(59,130,246,.16), 0 8px 24px rgba(15,23,42,.10) !important;
  }
  .modern-input {
    height: 44px;
    border-radius: 14px !important;
    border: 1px solid #cbd5e1 !important;
    background: #ffffff !important;
    color: #0f172a !important;
    box-shadow: 0 4px 14px rgba(15,23,42,.08);
    transition: border-color .2s ease, box-shadow .2s ease, transform .15s ease;
  }
  .modern-input:focus { transform: translateY(-1px); }
  .modern-input::placeholder { color: #64748b !important; }
  /* Compact control sizing for mobile and desktop */
  .compact-main {
    height: 40px !important;
    min-height: 40px !important;
    font-size: 13px !important;
    padding-left: 11px !important;
    padding-right: 11px !important;
    border-radius: 12px !important;
  }
  .compact-save {
    height: 38px !important;
    min-height: 38px !important;
    font-size: 12px !important;
    padding-left: 10px !important;
    padding-right: 10px !important;
    border-radius: 11px !important;
  }
  .compact-range {
    width: 56px !important;
    height: 36px !important;
    min-height: 36px !important;
    padding: 0 5px !important;
    border-radius: 10px !important;
    font-size: 12px !important;
  }
  .compact-room {
    max-width: 260px !important;
    height: 40px !important;
    min-height: 40px !important;
    font-size: 13px !important;
    padding: 0 12px !important;
    border-radius: 12px !important;
  }
  .troop-input {
    height: 34px !important;
    border-radius: 11px !important;
    background: #ffffff !important;
    color: #0f172a !important;
    border: 1px solid #cbd5e1 !important;
    box-shadow: 0 2px 8px rgba(15,23,42,.07);
  }
  @media (max-width: 430px) {
    .modern-input { height: 42px; border-radius: 13px !important; }
    .troop-input { height: 31px !important; font-size: 9px !important; }
  }
</style>

<style>
/* MIGSOCK — responsive single-row WebSocket cards */
#accounts{display:flex;flex-direction:column;gap:7px;padding-top:2px}
.troop-card{position:relative;background:linear-gradient(180deg,rgba(5,13,32,.96),rgba(2,7,20,.96));border:1px solid rgba(30,64,175,.42);border-radius:15px;padding:6px 7px;box-shadow:inset 0 1px 0 rgba(96,165,250,.06),0 6px 18px rgba(0,0,0,.18);overflow:hidden}
.troop-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#0ea5e9,#2563eb,#7c3aed);opacity:.75}
.troop-main{display:grid;grid-template-columns:26px 18px minmax(0,1fr) minmax(0,1fr) 42px 28px 28px;align-items:center;gap:4px;min-width:0;width:100%}
.troop-id{display:contents}
.troop-name{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:linear-gradient(180deg,#0b4ea2,#082c68);border:1px solid rgba(37,99,235,.7);font-size:9px;font-weight:800;color:#e0f2fe;line-height:1;box-shadow:0 0 10px rgba(37,99,235,.2);box-sizing:border-box}
.troop-status{position:relative;width:16px;height:16px;padding:0;margin:0;display:block;box-sizing:border-box;border-radius:50% 50% 50% 2px;transform:rotate(-45deg);font-size:0;line-height:0;white-space:nowrap;color:#94a3b8;background:#334155;border:1px solid #64748b;box-shadow:0 0 6px rgba(100,116,139,.35);overflow:visible}
.troop-status:before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;transform:translate(-50%,-50%) rotate(45deg);border-radius:50%;background:#cbd5e1;box-shadow:0 0 6px currentColor}
.troop-status:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid currentColor;opacity:.18;animation:statusRing 2s ease-out infinite}
.troop-status.online{color:#34d399;background:rgba(4,78,59,.95);border-color:#10b981;box-shadow:0 0 10px rgba(16,185,129,.45)}
.troop-status.online:before{background:#ecfdf5;box-shadow:0 0 8px #34d399}
.troop-status.suspend{color:#fbbf24;background:rgba(120,53,15,.95);border-color:#f59e0b;box-shadow:0 0 10px rgba(245,158,11,.42)}
.troop-status.suspend:before{background:#fff7ed;box-shadow:0 0 8px #f59e0b}
.troop-status.error{color:#fb7185;background:rgba(127,29,29,.95);border-color:#f43f5e;box-shadow:0 0 10px rgba(244,63,94,.42)}
.troop-status.error:before{background:#fff1f2;box-shadow:0 0 8px #fb7185}
.troop-status.connecting{color:#f59e0b;background:rgba(120,53,15,.95);border-color:#f59e0b;box-shadow:0 0 10px rgba(245,158,11,.42)}
.troop-status.connecting:before{background:#fff7ed;box-shadow:0 0 8px #f59e0b}
.troop-status.login{color:#60a5fa;background:rgba(30,64,175,.95);border-color:#3b82f6;box-shadow:0 0 10px rgba(59,130,246,.4)}
.troop-status.login:before{background:#eff6ff;box-shadow:0 0 8px #60a5fa}
.troop-status.offline{color:#94a3b8;background:rgba(30,41,59,.95);border-color:#475569;box-shadow:none}
.troop-status.offline:before{background:#cbd5e1;box-shadow:none}
.troop-credentials{display:contents;min-width:0}
.troop-input{width:100%;min-width:0;height:29px;background:#ffffff !important;border:1px solid rgba(51,65,85,.85);border-radius:8px;padding:0 6px;color:#0f172a !important;font-size:9px;line-height:1;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis}
.troop-input::placeholder{color:#64748b;opacity:1}
.troop-input:focus{background:#ffffff !important;color:#0f172a !important;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.18)}
.troop-balance{height:29px;min-width:0;width:100%;padding:0 4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:800;color:#e0f2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(180deg,rgba(9,44,100,.72),rgba(5,23,58,.9));border:1px solid rgba(37,99,235,.65);border-radius:999px;box-shadow:0 0 10px rgba(37,99,235,.12);box-sizing:border-box}
.troop-icon{width:28px;height:28px;padding:0;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .12s,border-color .12s;cursor:pointer;box-sizing:border-box}
.troop-icon:active{transform:scale(.92)}
.troop-icon svg{width:14px;height:14px}
.login-icon{color:#34d399;background:rgba(4,78,59,.3);border:1px solid rgba(16,185,129,.65);box-shadow:0 0 9px rgba(16,185,129,.08)}
.login-icon:hover{background:rgba(6,95,70,.5)}
.logout-icon{color:#fb7185;background:rgba(127,29,29,.22);border:1px solid rgba(225,29,72,.58)}
.logout-icon:hover{background:rgba(136,19,55,.35)}
@keyframes statusRing{0%{transform:scale(.7);opacity:.45}70%,100%{transform:scale(1.45);opacity:0}}
@media(max-width:365px){
  .troop-card{padding:5px 6px;border-radius:12px}
  .troop-main{grid-template-columns:24px 17px minmax(0,1fr) minmax(0,1fr) 38px 26px 26px;gap:3px}
  .troop-name{width:24px;height:24px;font-size:8px}
  .troop-status{width:15px;height:15px}
  .troop-input{height:27px;font-size:8px;padding:0 5px}
  .troop-balance{height:27px;font-size:7px}
  .troop-icon{width:26px;height:26px}
  .troop-icon svg{width:13px;height:13px}
}
</style>

<style id="login-mobile-animation">
/* Login UI - mobile friendly, animated, tanpa mengubah logic */
.login-icon{
  position:relative;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:transform .18s ease, box-shadow .25s ease, background .25s ease;
}
.login-icon::before{
  content:"";
  position:absolute;
  inset:-40%;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.20) 50%,transparent 65%);
  transform:translateX(-70%) rotate(8deg);
  animation:loginShine 3.8s ease-in-out infinite;
  pointer-events:none;
}
.login-icon svg{position:relative;z-index:1}
.login-icon:hover{
  transform:translateY(-1px) scale(1.04);
  box-shadow:0 0 18px rgba(16,185,129,.24);
}
.login-icon:active{transform:scale(.90)}
.troop-card{
  animation:troopIn .45s cubic-bezier(.2,.8,.2,1) both;
}
.troop-card:nth-child(1){animation-delay:.02s}
.troop-card:nth-child(2){animation-delay:.05s}
.troop-card:nth-child(3){animation-delay:.08s}
.troop-card:nth-child(4){animation-delay:.11s}
.troop-card:nth-child(5){animation-delay:.14s}
.troop-card:nth-child(6){animation-delay:.17s}
.troop-card:nth-child(7){animation-delay:.20s}
.troop-card:nth-child(8){animation-delay:.23s}
.troop-card:nth-child(9){animation-delay:.26s}
.troop-card:nth-child(10){animation-delay:.29s}
.troop-input{
  transition:border-color .22s ease,box-shadow .22s ease,transform .18s ease,background .22s ease;
}
.troop-input:focus{
  transform:translateY(-1px);
  background:#ffffff !important;color:#0f172a !important;
  box-shadow:0 0 0 2px rgba(59,130,246,.18),0 8px 20px rgba(0,0,0,.16);
}
.troop-status.online{
  animation:onlinePulse 2.2s ease-in-out infinite;
}
@keyframes troopIn{
  from{opacity:0;transform:translateY(8px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes loginShine{
  0%,55%{transform:translateX(-75%) rotate(8deg)}
  75%,100%{transform:translateX(75%) rotate(8deg)}
}
@keyframes onlinePulse{
  0%,100%{box-shadow:0 0 8px rgba(16,185,129,.10)}
  50%{box-shadow:0 0 14px rgba(16,185,129,.22)}
}
@media(max-width:430px){
  .login-icon{box-shadow:0 0 12px rgba(16,185,129,.12)}
  .troop-card{animation-duration:.38s}
}
@media(prefers-reduced-motion:reduce){
  .troop-card,.login-icon::before,.troop-status.online{
    animation:none!important;
  }
  .login-icon,.troop-input{transition:none!important}
}
</style>


<style id="main-login-animation">
.login-all-button{
  position:relative;
  overflow:hidden;
  transition:transform .18s ease,box-shadow .25s ease,background .25s ease;
}
.login-all-button::after{
  content:"";
  position:absolute;
  top:0;bottom:0;width:45%;
  left:-55%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  transform:skewX(-18deg);
  animation:mainLoginSweep 4.5s ease-in-out infinite;
}
.login-all-button svg,.login-all-button{
  isolation:isolate;
}
.login-all-button:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 26px rgba(16,185,129,.18);
}
.login-all-button:active{transform:scale(.97)}
@keyframes mainLoginSweep{
  0%,55%{left:-55%}
  80%,100%{left:120%}
}
@media(prefers-reduced-motion:reduce){
  .login-all-button::after{animation:none}
}
</style>


<style id="login-full-width">
@media (max-width:768px){
html,body{width:100%;max-width:100%;overflow-x:hidden}
.login-container,.login-panel,.login-card,.login-box{
width:100%!important;max-width:none!important;
margin-left:0!important;margin-right:0!important;
box-sizing:border-box!important;border-radius:0!important;
}
.login-container{padding-left:8px!important;padding-right:8px!important}
}
</style>

<style id="command-toggle-style">
#accountCommandBox{min-height:48px}
#accountCommandButtons{transition:opacity .2s ease,transform .2s ease,max-height .2s ease}
#mainControlPanel.commands-collapsed > :not(#toggleAccountCommands){display:none!important}
#mainControlPanel.commands-collapsed{padding-top:10px!important;padding-bottom:24px!important;gap:0!important}
#mainControlPanel.commands-collapsed #toggleAccountCommands{display:flex!important}
#toggleAccountCommands{bottom:-1rem!important}
</style>
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white">

<div class="max-w-4xl mx-auto px-3 sm:px-6 py-4 sm:py-8 space-y-4 sm:space-y-6">
  
  <!-- Header Card -->
  <div id="pageHeader" class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-0 shadow-2xl relative overflow-hidden flex flex-col items-center justify-center text-center">
    <div class="absolute -right-12 -top-12 w-48 h-48 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -left-12 -bottom-12 w-48 h-48 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="relative z-10 w-full flex items-center justify-center overflow-hidden">
      <img
        src="/logo.webp"
        alt="migsock TEAM"
        class="block w-full max-w-[620px] h-[150px] sm:h-[190px] object-contain object-center"
      >
    </div>
  </div>

  <div id="mainControlPanel" class="relative bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-4 sm:space-y-5">
    <div class="flex items-center justify-between">
      <h3 class="text-base sm:text-lg font-bold text-slate-100 flex items-center gap-2">
        
      
      </h3>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 items-start">
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-400">Main troop</label>
        <input id="mainTroop" class="modern-input compact-main w-full px-3 text-sm transition-all" placeholder="Contoh: u1" autocomplete="off">
      </div>
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-400">Main password</label>
        <div class="flex gap-2">
          <input id="mainPassword" type="password" class="modern-input compact-main min-w-0 flex-1 px-3 text-sm transition-all" placeholder="Password akun" autocomplete="off">
          <button id="generatePassword" class="shrink-0 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-[11px] font-bold whitespace-nowrap transition-all border border-slate-700/80 active:scale-95">Set Pass</button>
        </div>

        <div class="pt-2">
          <label class="block text-[11px] font-semibold text-slate-400 mb-1.5">Save / Load</label>
          <div class="flex gap-2">
            <input id="saveName" class="modern-input compact-save min-w-0 flex-1 px-3 text-sm" value="troop1" placeholder="Nama file save" autocomplete="off">
            <button id="saveAccounts" class="shrink-0 bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-lg shadow-lg shadow-blue-600/20 transition-all active:scale-95 flex items-center justify-center w-10 h-9" title="Save JSON" aria-label="Save JSON">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            </button>
            <button id="loadAccounts" class="shrink-0 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 p-2 rounded-lg transition-all active:scale-95 flex items-center justify-center w-10 h-9" title="Load JSON" aria-label="Load JSON">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            </button>
          </div>
          <input id="loadFile" class="hidden" type="file" accept="application/json,.json">
        </div>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3.5 pt-3 border-t border-slate-800/60">
      <div class="flex items-center gap-2.5 justify-between sm:justify-start">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400">Mulai</label>

        </div>
        <span class="text-slate-500 mt-6 text-xs font-medium">s/d</span>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400">Akhir</label>
          <input id="rangeEnd" type="number" class="modern-input compact-range bg-slate-950/80 border border-slate-800/80 rounded-xl px-2 py-2 text-center text-sm font-bold text-slate-200 focus:border-blue-500" value="10">
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="generateTroop" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-xl text-xs sm:text-sm shadow-lg shadow-blue-600/25 transition-all active:scale-95 flex items-center justify-center gap-2">

          GENERATE TROOP
        </button>
        <button id="clearFields" class="bg-rose-950/40 hover:bg-rose-900/50 text-rose-400 border border-rose-800/40 font-bold px-3.5 py-3 rounded-xl text-xs transition-all active:scale-95 flex items-center justify-center" title="Hapus Semua">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
      </div>
    </div>

    <!-- Accounts List Container -->
    <div id="accounts" class="space-y-1.5 pt-1"></div>

    <div id="accountCommandBox" class="relative pt-2.5 border-t border-slate-800/60">
      <div id="accountCommandButtons" class="flex flex-row gap-2">
      <button id="loginAll" class="login-all-button flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-3 rounded-xl text-xs sm:text-sm shadow-lg shadow-emerald-600/20 transition-all active:scale-95 flex items-center justify-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        LOGIN ALL
      </button>
      <button id="logoutAll" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 px-3 rounded-xl text-xs sm:text-sm border border-slate-700 transition-all active:scale-95 flex items-center justify-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        LOGOUT ALL
      </button>
      </div>
    </div>
    <button id="toggleAccountCommands" type="button" onclick="toggleAccountCommands()" class="absolute right-1 bottom-0 translate-y-1/2 z-10 w-8 h-8 rounded-full bg-slate-800 border border-slate-600 text-slate-300 shadow-lg flex items-center justify-center transition-all active:scale-90" title="Sembunyikan bagian atas" aria-label="Sembunyikan bagian atas" aria-expanded="true">
      <svg id="toggleAccountCommandsIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m6 15 6-6 6 6"/></svg>
    </button>
  </div>


  <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5">
    <div class="flex flex-col sm:flex-row gap-2.5">
      <input id="room" class="modern-input compact-room flex-1 bg-slate-950/80 border border-slate-800/80 rounded-xl px-3 py-2 text-sm text-slate-200 focus:border-blue-500 placeholder:text-slate-600" placeholder="Nama room tujuan..." autocomplete="off">
      <div class="grid grid-cols-2 sm:flex sm:flex-row gap-2.5">
        <button onclick="joinAll()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-xl text-xs sm:text-sm shadow-lg shadow-blue-600/20 transition-all active:scale-95 whitespace-nowrap">JOIN</button>
        <button onclick="leaveAll()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-3 rounded-xl text-xs sm:text-sm border border-slate-700 transition-all active:scale-95 whitespace-nowrap">LEAVE</button>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2.5">
      <button onclick="participants()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-bold py-3 px-3 rounded-xl text-xs sm:text-sm border border-slate-700 transition-all active:scale-95">LIST USER</button>
      <button onclick="balanceAll()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-bold py-3 px-3 rounded-xl text-xs sm:text-sm border border-slate-700 transition-all active:scale-95">REFRESH SALDO</button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
    
    <!-- Participants Column -->
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5 flex flex-col">
      <div class="flex items-center justify-between">
        <h3 class="text-sm sm:text-base font-bold text-slate-200">List User</h3>
        <div class="flex items-center gap-2">
          <span class="text-[11px] font-medium text-slate-400 bg-slate-950 px-2.5 py-1 rounded-full border border-slate-800/80">Centang untuk pilih</span>
          <button onclick="clearParticipants()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 border border-rose-900/40 hover:bg-rose-950/30 font-bold rounded-lg text-xs transition-all active:scale-95 flex items-center justify-center w-9 h-9 shrink-0" title="Hapus List User" aria-label="Hapus List User">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
      <div id="participantsList" class="flex-1 min-h-[200px] max-h-[280px] overflow-y-auto bg-slate-950/80 border border-slate-800/80 rounded-xl p-2 space-y-1.5">
        <div class="flex items-center justify-center h-full text-xs text-slate-500 py-10">Belum ada data user.</div>
      </div>
    </div>

    <!-- Target Kick Column -->
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5 flex flex-col">
      <div class="flex items-center justify-between gap-2">
        <h3 class="text-sm sm:text-base font-bold text-slate-200">Target Kick</h3>
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] font-medium text-slate-400 bg-slate-950 px-2.5 py-1 rounded-full border border-slate-800/80">Daftar Eksekusi</span>
        </div>
      </div>
      <div id="targetList" class="flex-1 min-h-[200px] max-h-[280px] overflow-y-auto bg-slate-950/80 border border-slate-800/80 rounded-xl p-2 space-y-1.5">
        <div class="flex items-center justify-center h-full text-xs text-slate-500 py-10">Belum ada target.</div>
      </div>
      <div class="grid grid-cols-[minmax(0,1fr)_58px_58px_58px_42px] items-end gap-1.5">
        <div class="min-w-0">
          <button id="kickAllButton" onclick="kickSelectedTargets()" class="w-full h-9 bg-rose-600 hover:bg-rose-500 text-white font-bold px-2 rounded-lg text-[10px] transition-all shadow-md shadow-rose-600/20 active:scale-95">KICK ALL</button>
          <div id="timerValue" class="mt-1 w-full h-6 flex items-center justify-center rounded-lg bg-slate-950/80 border border-slate-800 text-[9px] font-semibold text-slate-400">60000</div>
        </div>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Timer</span>
          <input id="kickTimer" type="number" min="0" step="1" value="1500" class="modern-input w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500" inputmode="numeric">
        </label>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Delay</span>
          <input id="textdelay" type="number" min="0" step="1" value="50" class="modern-input w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500" inputmode="numeric">
        </label>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Loop</span>
          <input id="textloop" type="number" min="1" step="1" value="5" class="modern-input w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500" inputmode="numeric">
        </label>
        <div class="flex flex-col gap-1">
          <button onclick="resetTimer()" class="bg-blue-950/40 hover:bg-blue-900/50 text-blue-400 border border-blue-800/50 font-bold rounded-lg text-xs transition-all active:scale-95 flex items-center justify-center w-9 h-9 shrink-0" title="Reset Timer" aria-label="Reset Timer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v3l2 1M8.5 5.5 7 4m8.5 1.5L17 4M9 3h6"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5">
    <div class="flex items-center justify-between gap-2">
      <h3 class="sr-only">API Event</h3>
    </div>
    
    
    <div id="kickProgress" class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 space-y-2">
      <div class="flex justify-between items-center gap-2 text-[11px] font-semibold">
        <span class="text-slate-300">KICK ALL PROGRESS</span>
        <span id="kickProgressText" class="text-blue-400">Siap</span>
      </div>
      <div class="h-2.5 rounded-full bg-slate-800 overflow-hidden">
        <div id="kickProgressBar" class="h-full w-0 rounded-full bg-gradient-to-r from-blue-500 to-indigo-400 transition-all duration-300"></div>
      </div>
      <div class="flex justify-between gap-2 text-[10px]">
        <span id="kickProgressStep" class="text-slate-400">Target 0/0</span>
      </div>
      <div class="text-[10px] font-semibold text-slate-400 pt-1">PROGRESS TARGET</div>
      <div id="kickTargetProgress" class="grid grid-cols-5 gap-1"></div>
      <div id="kickProgressMeta" class="text-[10px] text-slate-500">Menunggu perintah kick...</div>
    </div>
  </div>

</div>

<script src="/frontend.js?v=11"></script>
</body>
</html>
