<!doctype html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIGMASTER PROTOTIPE 1.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'sans-serif'],
        },
      }
    }
  }
</script>
<style>
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #07090e;
    color: #f1f5f9;
    -webkit-tap-highlight-color: transparent;
  }
  input, button {
    outline: none;
  }
  input:focus, button:focus {
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
  }
  ::-webkit-scrollbar {
    width: 4px;
    height: 4px;
  }
  ::-webkit-scrollbar-track {
    background: #0b0f19;
  }
  ::-webkit-scrollbar-thumb {
    background: #1e293b;
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #334155;
  }
</style>
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white">

<div class="max-w-4xl mx-auto px-3 sm:px-6 py-4 sm:py-8 space-y-4 sm:space-y-6">
  
  <!-- Header Card -->
  <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-5 sm:p-8 shadow-2xl relative overflow-hidden flex flex-col items-center justify-center text-center">
    <div class="absolute -right-12 -top-12 w-48 h-48 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -left-12 -bottom-12 w-48 h-48 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="relative z-10 flex flex-col items-center">
      <div class="w-14 h-14 sm:w-20 sm:h-20 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-2xl sm:rounded-3xl flex items-center justify-center shadow-xl shadow-blue-900/30 mb-3.5 sm:mb-4 border border-blue-400/30">
        <svg class="w-7 h-7 sm:w-10 sm:h-10 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <h1 class="text-xl sm:text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-indigo-500">
        MIGMASTER PROTOTIPE 1.0
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-2 max-w-lg leading-relaxed px-2">
        
      </p>
    </div>
  </div>

  <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-4 sm:space-y-5">
    <div class="flex items-center justify-between">
      <h3 class="text-base sm:text-lg font-bold text-slate-100 flex items-center gap-2">
        
      
      </h3>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-400">Main troop</label>
        <input id="mainTroop" class="w-full bg-slate-950/80 border border-slate-800/80 rounded-xl px-3.5 py-3 text-sm text-slate-200 focus:border-blue-500 transition-all placeholder:text-slate-600" placeholder="Contoh: u1" autocomplete="off">
      </div>
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-400">Main password</label>
        <div class="flex gap-2">
          <input id="mainPassword" type="password" class="w-full bg-slate-950/80 border border-slate-800/80 rounded-xl px-3.5 py-3 text-sm text-slate-200 focus:border-blue-500 transition-all placeholder:text-slate-600" placeholder="Password akun" autocomplete="off">
          <button id="generatePassword" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-3 rounded-xl text-xs font-bold whitespace-nowrap transition-all border border-slate-700/80 active:scale-95">Set Pass</button>
        </div>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3.5 pt-3 border-t border-slate-800/60">
      <div class="flex items-center gap-2.5 justify-between sm:justify-start">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400">Mulai</label>
          <input id="rangeStart" type="number" class="w-20 bg-slate-950/80 border border-slate-800/80 rounded-xl px-3 py-2.5 text-center text-sm font-bold text-slate-200 focus:border-blue-500" value="1">
        </div>
        <span class="text-slate-500 mt-6 text-xs font-medium">s/d</span>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400">Akhir</label>
          <input id="rangeEnd" type="number" class="w-20 bg-slate-950/80 border border-slate-800/80 rounded-xl px-3 py-2.5 text-center text-sm font-bold text-slate-200 focus:border-blue-500" value="10">
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="generateTroop" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-xl text-xs sm:text-sm shadow-lg shadow-blue-600/25 transition-all active:scale-95 flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          GENERATE TROOP
        </button>
        <button id="clearFields" class="bg-rose-950/40 hover:bg-rose-900/50 text-rose-400 border border-rose-800/40 font-bold px-3.5 py-3 rounded-xl text-xs transition-all active:scale-95 flex items-center justify-center" title="Hapus Semua">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
      </div>
    </div>

    <!-- Accounts List Container -->
    <div id="accounts" class="space-y-2.5 pt-1"></div>

    <div class="flex flex-row gap-2.5 pt-3 border-t border-slate-800/60">
      <button id="loginAll" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-3 rounded-xl text-xs sm:text-sm shadow-lg shadow-emerald-600/20 transition-all active:scale-95 flex items-center justify-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        LOGIN ALL
      </button>
      <button id="logoutAll" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 px-3 rounded-xl text-xs sm:text-sm border border-slate-700 transition-all active:scale-95 flex items-center justify-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        LOGOUT ALL
      </button>
    </div>
  </div>

  <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5">
    <div class="flex items-center gap-2">
      <input id="saveName" class="flex-1 bg-slate-950/80 border border-slate-800/80 rounded-xl px-3.5 py-3 text-sm text-slate-200 focus:border-blue-500 placeholder:text-slate-600" value="troop1" placeholder="Nama file save">
      <div class="flex items-center gap-2 shrink-0">
        <button id="saveAccounts" class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl shadow-lg shadow-blue-600/20 transition-all active:scale-95 flex items-center justify-center w-11 h-11" title="Save JSON">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        </button>
        <button id="loadAccounts" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 p-3 rounded-xl transition-all active:scale-95 flex items-center justify-center w-11 h-11" title="Load JSON">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        </button>
      </div>
      <input id="loadFile" class="hidden" type="file" accept="application/json,.json">
    </div>
  </div>

  <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5">
    <div class="flex flex-col sm:flex-row gap-2.5">
      <input id="room" class="flex-1 bg-slate-950/80 border border-slate-800/80 rounded-xl px-3.5 py-3 text-sm text-slate-200 focus:border-blue-500 placeholder:text-slate-600" placeholder="Nama room tujuan..." autocomplete="off">
      <div class="grid grid-cols-2 sm:flex sm:flex-row gap-2.5">
        <button onclick="joinAll()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-xl text-xs sm:text-sm shadow-lg shadow-blue-600/20 transition-all active:scale-95 whitespace-nowrap">JOIN</button>
        <button onclick="leaveAll()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-3 rounded-xl text-xs sm:text-sm border border-slate-700 transition-all active:scale-95 whitespace-nowrap">LEAVE</button>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2.5">
      <button onclick="participants()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-bold py-3 px-3 rounded-xl text-xs sm:text-sm border border-slate-700 transition-all active:scale-95">LIST PESERTA</button>
      <button onclick="balanceAll()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-bold py-3 px-3 rounded-xl text-xs sm:text-sm border border-slate-700 transition-all active:scale-95">CEK SALDO ALL</button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
    
    <!-- Participants Column -->
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5 flex flex-col">
      <div class="flex items-center justify-between">
        <h3 class="text-sm sm:text-base font-bold text-slate-200">Participants</h3>
        <div class="flex items-center gap-2">
          <span class="text-[11px] font-medium text-slate-400 bg-slate-950 px-2.5 py-1 rounded-full border border-slate-800/80">Centang untuk pilih</span>
          <button onclick="clearParticipants()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 border border-rose-900/40 hover:bg-rose-950/30 font-bold rounded-lg text-xs transition-all active:scale-95 flex items-center justify-center w-9 h-9 shrink-0" title="Hapus List Peserta" aria-label="Hapus List Peserta">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
      <div id="participantsList" class="flex-1 min-h-[200px] max-h-[280px] overflow-y-auto bg-slate-950/80 border border-slate-800/80 rounded-xl p-2 space-y-1.5">
        <div class="flex items-center justify-center h-full text-xs text-slate-500 py-10">Belum ada data participants.</div>
      </div>
    </div>

    <!-- Target Kick Column -->
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5 flex flex-col">
      <div class="flex items-center justify-between">
        <h3 class="text-sm sm:text-base font-bold text-slate-200">Target Kick</h3>
        <span class="text-[11px] font-medium text-slate-400 bg-slate-950 px-2.5 py-1 rounded-full border border-slate-800/80">Daftar Eksekusi</span>
      </div>
      <div id="targetList" class="flex-1 min-h-[200px] max-h-[280px] overflow-y-auto bg-slate-950/80 border border-slate-800/80 rounded-xl p-2 space-y-1.5">
        <div class="flex items-center justify-center h-full text-xs text-slate-500 py-10">Belum ada target.</div>
      </div>
      <div class="grid grid-cols-[minmax(0,1fr)_58px_58px_58px_42px] items-end gap-1.5">
        <div class="min-w-0">
          <button id="kickAllButton" onclick="kickSelectedTargets()" class="w-full h-9 bg-rose-600 hover:bg-rose-500 text-white font-bold px-2 rounded-lg text-[10px] transition-all shadow-md shadow-rose-600/20 active:scale-95">KICK ALL</button>
          <div id="timerValue" class="mt-1 w-full h-6 flex items-center justify-center rounded-lg bg-slate-950/80 border border-slate-800 text-[9px] font-semibold text-slate-400">60000</div>
        </div>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Timer</span>
          <input id="kickTimer" type="number" min="0" step="1" value="1500" class="w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500" inputmode="numeric">
        </label>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Delay</span>
          <input id="textdelay" type="number" min="0" step="1" value="50" class="w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500" inputmode="numeric">
        </label>
        <label class="min-w-0">
          <span class="block text-[8px] uppercase tracking-wide text-slate-500 mb-1 text-center">Loop</span>
          <input id="textloop" type="number" min="1" step="1" value="5" class="w-full h-9 bg-slate-950/80 border border-slate-700 rounded-lg px-1 text-center text-[10px] text-slate-200 outline-none focus:border-blue-500" inputmode="numeric">
        </label>
        <div class="flex flex-col gap-1">
          <button onclick="resetTimer()" class="bg-blue-950/40 hover:bg-blue-900/50 text-blue-400 border border-blue-800/50 font-bold rounded-lg text-xs transition-all active:scale-95 flex items-center justify-center w-10 h-9 shrink-0" title="Reset Timer" aria-label="Reset Timer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v3l2 1M8.5 5.5 7 4m8.5 1.5L17 4M9 3h6"/></svg>
          </button>
          <button onclick="clearTargets()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 border border-rose-900/40 hover:bg-rose-950/30 font-bold rounded-lg text-xs transition-all active:scale-95 flex items-center justify-center w-10 h-9 shrink-0" title="Hapus Semua Target" aria-label="Hapus Semua Target">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a1.9 1.9 0 01-1.9-1.8L5 7m5 4v6m4-6v6m1-10V4a1 1 0 01-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-xl space-y-3.5">
    <div class="flex items-center justify-between gap-2">
      <h3 class="sr-only">API Event</h3>
    </div>
    
    
    <div id="kickProgress" class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 space-y-2">
      <div class="flex justify-between items-center gap-2 text-[11px] font-semibold">
        <span class="text-slate-300">KICK ALL PROGRESS</span>
        <span id="kickProgressText" class="text-blue-400">Siap</span>
      </div>
      <div class="h-2.5 rounded-full bg-slate-800 overflow-hidden">
        <div id="kickProgressBar" class="h-full w-0 rounded-full bg-gradient-to-r from-blue-500 to-indigo-400 transition-all duration-300"></div>
      </div>
      <div class="flex justify-between gap-2 text-[10px]">
        <span id="kickProgressStep" class="text-slate-400">Target 0/0</span>
      </div>
      <div class="text-[10px] font-semibold text-slate-400 pt-1">PROGRESS WEBSOCKET</div>
      <div id="kickWsProgress" class="grid grid-cols-2 sm:grid-cols-5 gap-1"></div>
      <div class="text-[10px] font-semibold text-slate-400 pt-1">PROGRESS TARGET</div>
      <div id="kickTargetProgress" class="grid grid-cols-5 gap-1"></div>
      <div id="kickProgressMeta" class="text-[10px] text-slate-500">Menunggu perintah kick...</div>
    </div>
  </div>

</div>

<script src="/frontend.js"></script>
</body>
</html>
